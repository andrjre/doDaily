<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doDaily</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/doDaily_bear.png">
</head>
<body>
    
    <header>
        <h1 id="timer">Time until reset: <span id="countdown">00:00:00</span></h1>
        <img id="bear" src="assets/doDaily_bear.png">
        <h1 id="title">doDaily.io</h1>
        <div id="top_create">+</div>
    </header>

    <main>
        <div id="content">
            <div id="todoListContainer">
                <div id="todoList"></div>
            </div>
            <div id="dropdown">
                <input id="task_input"type="text">
                <input id="submit"type="submit" value="Submit">
            </div>
        </div>
    </main>

    <footer>
        <p id="gh">https://github.com/andrjre/doDaily</p>
    </footer>

<script src="index.js"></script>    
</body>
</html>
